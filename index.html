const { useState, useEffect } = React;

// ── DEBUG: surface any runtime error directly into the page so we can read
// it on the iPad without DevTools. Remove for v0.1.8 stable.
window.addEventListener(‘error’, function(e) {
try {
const root = document.getElementById(‘root’);
if (!root) return;
const msg = (e.error && e.error.stack) || e.message || ‘Unknown error’;
root.innerHTML =
‘<div style="padding:20px;color:#fff;font-family:monospace;font-size:14px;line-height:1.4;background:#7f1d1d;min-height:100vh;white-space:pre-wrap;word-break:break-word;">’ +
‘<strong>JS error caught:</strong>\n\n’ +
String(msg).replace(/&/g,’&’).replace(/</g,’<’).replace(/>/g,’>’) +
‘\n\nFile: ’ + (e.filename || ‘?’) + ‘\nLine: ’ + (e.lineno || ‘?’) + ’ Col: ’ + (e.colno || ‘?’) +
‘</div>’;
} catch (ignored) {}
});
window.addEventListener(‘unhandledrejection’, function(e) {
try {
const root = document.getElementById(‘root’);
if (!root || root.children.length > 1) return;  // don’t overwrite an already-mounted app
root.innerHTML =
‘<div style="padding:20px;color:#fff;font-family:monospace;font-size:14px;background:#7f1d1d;min-height:100vh;white-space:pre-wrap;">’ +
‘<strong>Unhandled promise rejection:</strong>\n\n’ +
String((e.reason && e.reason.stack) || e.reason || ‘Unknown’).replace(/</g,’<’) +
‘</div>’;
} catch (ignored) {}
});

// ── CONFIG ────────────────────────────────────────────────────────────────────
const API_BASE = ‘https://ourhealthwatch-backend.onrender.com’;
const APP_VERSION = ‘0.1.7’;
const TOKEN_KEY = ‘oh_token’;
const USER_KEY = ‘oh_user’;

// v0.1.7: same 12-region taxonomy as Cruise Ship Watch / EarthWatch.
const OH_REGIONS = [
‘Africa’, ‘Alaska’, ‘Arctic’, ‘Asia’, ‘Caribbean’, ‘Central America’,
‘Mediterranean’, ‘Middle East’, ‘North America’, ‘Northern Europe’,
‘Oceania’, ‘South America’
];

// ── HELPERS ───────────────────────────────────────────────────────────────────
function getToken() {
try { return localStorage.getItem(TOKEN_KEY); } catch (e) { return null; }
}
function getStoredUser() {
try {
const raw = localStorage.getItem(USER_KEY);
return raw ? JSON.parse(raw) : null;
} catch (e) { return null; }
}
function authHeaders() {
const t = getToken();
return t ? { ‘Authorization’: ‘Bearer ’ + t } : {};
}
function jsonHeaders() {
return Object.assign({ ‘Content-Type’: ‘application/json’ }, authHeaders());
}
function fmtDate(s) {
if (!s) return ‘’;
// openFDA returns YYYYMMDD strings; NORS returns YYYY-MM
if (/^\d{8}$/.test(s)) {
return s.substring(0,4) + ‘-’ + s.substring(4,6) + ‘-’ + s.substring(6,8);
}
return s;
}
function fmtRelative(iso) {
if (!iso) return ‘’;
try {
const then = new Date(iso);
const diffMin = Math.round((Date.now() - then.getTime()) / 60000);
if (diffMin < 1) return ‘just now’;
if (diffMin < 60) return diffMin + ’ min ago’;
const hrs = Math.round(diffMin / 60);
if (hrs < 24) return hrs + ’ hr ago’;
const days = Math.round(hrs / 24);
return days + ’ day’ + (days === 1 ? ‘’ : ‘s’) + ’ ago’;
} catch (e) { return ‘’; }
}
function classBadge(cls) {
if (cls === ‘I’ || cls === ‘II’ || cls === ‘III’) return ‘class-’ + cls;
return ‘class-III’;
}
function sourceLabel(src) {
if (src === ‘fda_drug’) return ‘Drug’;
if (src === ‘fda_device’) return ‘Device’;
if (src === ‘cdc_nors’) return ‘NORS’;
if (src === ‘who_don’) return ‘WHO’;
if (src === ‘cdc_vsp’) return ‘VSP’;
return src || ‘’;
}
function sourceBadgeClass(src) {
if (src === ‘fda_drug’) return ‘source-drug’;
if (src === ‘fda_device’) return ‘source-device’;
if (src === ‘cdc_nors’ || src === ‘who_don’ || src === ‘cdc_vsp’) return ‘source-outbreak’;
return ‘class-III’;
}

// ── LOGIN SCREEN ──────────────────────────────────────────────────────────────
function LoginScreen(props) {
const [mode, setMode] = useState(‘login’);
const [email, setEmail] = useState(’’);
const [password, setPassword] = useState(’’);
const [busy, setBusy] = useState(false);
const [err, setErr] = useState(’’);

function submit() {
setErr(’’);
if (!email || !password) { setErr(‘Email and password required’); return; }
if (mode === ‘register’ && password.length < 8) {
setErr(‘Password must be at least 8 characters’); return;
}
setBusy(true);
if (document.activeElement) document.activeElement.blur();
const path = mode === ‘register’ ? ‘/auth/register’ : ‘/auth/login’;
fetch(API_BASE + path, {
method: ‘POST’,
headers: { ‘Content-Type’: ‘application/json’ },
body: JSON.stringify({ email: email, password: password })
})
.then(function(r) { return r.json().then(function(d) { return { ok: r.ok, d: d }; }); })
.then(function(res) {
setBusy(false);
if (!res.ok) { setErr(res.d.detail || ‘Auth failed’); return; }
try {
localStorage.setItem(TOKEN_KEY, res.d.token);
localStorage.setItem(USER_KEY, JSON.stringify({ user_id: res.d.user_id, email: res.d.email }));
} catch (e) {}
props.onAuth({ user_id: res.d.user_id, email: res.d.email });
})
.catch(function() { setBusy(false); setErr(‘Network error’); });
}

return (
<div className=“ohw-bg-login min-h-screen flex flex-col items-center px-4”
style={{ paddingTop: ‘4vh’, paddingBottom: ‘8vh’ }}>
