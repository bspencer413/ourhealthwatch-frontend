window.addEventListener('error', function(e){
  var root = document.getElementById('root');
  if (root) {
    root.innerHTML = '<div style="padding:60px 20px 20px;color:#fff;font-family:monospace;font-size:14px;background:#7f1d1d;min-height:100vh;white-space:pre-wrap;word-break:break-word;">' +
      '<strong>JS ERROR</strong>\n\n' +
      String(e.message || '?').replace(/</g,'&lt;') +
      '\n\nFile: ' + (e.filename || '?') +
      '\nLine: ' + (e.lineno || '?') + '  Col: ' + (e.colno || '?') +
      (e.error && e.error.stack ? '\n\nStack:\n' + String(e.error.stack).replace(/</g,'&lt;') : '') +
      '</div>';
  }
  showBanner('debug2 caught JS error', '#dc2626');
});
window.addEventListener('unhandledrejection', function(e){
  var root = document.getElementById('root');
  if (root && root.children.length <= 1) {
    root.innerHTML = '<div style="padding:60px 20px 20px;color:#fff;font-family:monospace;font-size:14px;background:#7f1d1d;min-height:100vh;white-space:pre-wrap;">' +
      '<strong>PROMISE REJECTED</strong>\n\n' +
      String((e.reason && e.reason.stack) || e.reason || 'Unknown').replace(/</g,'&lt;') +
      '</div>';
  }
});

<script>
// After 6s, if React still hasn't mounted, surface diagnostics so we can see what failed.
  setTimeout(function(){
    if (window.__ohwBannerSet) {
      var hasReact = (typeof React !== 'undefined');
      var hasReactDOM = (typeof ReactDOM !== 'undefined');
      var hasBabel = (typeof Babel !== 'undefined');
      var hasTw = (typeof tailwind !== 'undefined');
      // If React mounted already, leave the green banner alone.
      var b = document.getElementById('debug-banner');
      if (b && b.textContent.indexOf('mounted OK') !== -1) return;
      var bits = [
        'tailwind:' + (window.__cdn_tailwind===1 ? 'ok' : window.__cdn_tailwind===0 ? 'FAIL' : '?'),
        'react:' + (window.__cdn_react===1 ? 'ok' : window.__cdn_react===0 ? 'FAIL' : '?') + '/' + (hasReact?'global':'NOGLOBAL'),
        'reactdom:' + (window.__cdn_reactdom===1 ? 'ok' : window.__cdn_reactdom===0 ? 'FAIL' : '?') + '/' + (hasReactDOM?'global':'NOGLOBAL'),
        'appjs:' + (window.__cdn_appjs===1 ? 'LOADED' : window.__cdn_appjs===0 ? '404/FAIL' : 'NOTLOADED'),
        'babel:' + (window.__cdn_babel===1 ? 'ok' : window.__cdn_babel===0 ? 'FAIL' : '?') + '/' + (hasBabel?'global':'NOGLOBAL')
      ];
      var step = window.__ohwStep || 'NEVER STARTED';
      window.__ohwBannerSet('STEP: ' + step + ' | ' + bits.join(' | '), '#fbbf24');
    }
  }, 6000);
</script>
