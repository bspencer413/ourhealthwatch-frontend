<!-- Production crash-screen handlers — paint the page red on JS error or
     unhandled promise rejection so production failures are visible rather
     than silent. Replaces the v0.1.7 debug banner mechanism. -->
<script>
  (function(){
    window.addEventListener('error', function(e){
      var root = document.getElementById('root');
      if (root) {
        root.innerHTML = '<div style="padding:60px 20px 20px;color:#fff;font-family:monospace;font-size:14px;background:#7f1d1d;min-height:100vh;white-space:pre-wrap;word-break:break-word;">' +
          '<strong>JS ERROR</strong>\n\n' +
          String(e.message || '?').replace(/</g,'&lt;') +
          '\n\nFile: ' + (e.filename || '?') +
          '\nLine: ' + (e.lineno || '?') + '  Col: ' + (e.colno || '?') +
          (e.error && e.error.stack ? '\n\nStack:\n' + String(e.error.stack).replace(/</g,'&lt;') : '') +
          '</div>';
      }
    });
    window.addEventListener('unhandledrejection', function(e){
      var root = document.getElementById('root');
      if (root && root.children.length <= 1) {
        root.innerHTML = '<div style="padding:60px 20px 20px;color:#fff;font-family:monospace;font-size:14px;background:#7f1d1d;min-height:100vh;white-space:pre-wrap;">' +
          '<strong>PROMISE REJECTED</strong>\n\n' +
          String((e.reason && e.reason.stack) || e.reason || 'Unknown').replace(/</g,'&lt;') +
          '</div>';
      }
    });
  })();
</script>
